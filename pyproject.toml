[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "inference-bench"
version = "0.1.0"
description = "Benchmark and compare LLM inference engines"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "tabulate>=0.9",
]

[project.scripts]
inference-bench = "inference_bench.main:main"
