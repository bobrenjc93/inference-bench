[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-bench"
version = "0.1.0"
description = "Benchmark and compare LLM inference engines"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "tabulate>=0.9",
    "transformers>=4.46",
]

[tool.setuptools.packages.find]
include = ["inference_bench*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["builds"]

[project.scripts]
inference-bench = "inference_bench.main:main"
